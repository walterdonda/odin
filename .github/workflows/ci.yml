# CI multiplataforma de ODIN (Item 073).
#
# Se ejecuta en `push`/`pull_request` (ver "Integración continua" del README y
# docs/service.md §9). No usa secretos y solo necesita permiso de lectura del
# contenido.
#
# El gate de cada job es `scripts/verify.py` (Item 071), el mismo que corre
# localmente: `uv sync` -> pytest -> ruff -> mypy -> `odin validate` de los dos
# ejemplos. El job Windows suma el ciclo de vida real del servicio contra el
# SCM (los runners son administradores) con el escenario gated
# `ODIN_WINDOWS_SERVICE_SMOKE=1`. El job `postgresql` (soporte PostgreSQL)
# suma la integración end-to-end contra un servicio `postgres:18` (imagen
# oficial, health check con `pg_isready`; la contraseña es un valor de prueba
# fijo, no un secreto).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar uv (con caché)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sincronizar el entorno
        run: uv sync --locked

      - name: Gate de verificación (scripts/verify.py)
        run: uv run python scripts/verify.py

      - name: Construir wheel y sdist
        run: uv build

      - name: Publicar el wheel como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: odin-wheel-linux
          path: dist/*.whl
          if-no-files-found: error

  postgresql:
    name: PostgreSQL (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: odin-postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar uv (con caché)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sincronizar el entorno
        run: uv sync --locked

      - name: Integración PostgreSQL (postgres:18)
        run: uv run pytest tests/test_backup_integration_postgres.py -q

  windows:
    name: Windows (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar uv (con caché)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sincronizar el entorno
        run: uv sync --locked

      - name: Gate de verificación (scripts/verify.py)
        run: uv run python scripts/verify.py

      - name: Ciclo de vida real del servicio Windows (SCM)
        env:
          ODIN_WINDOWS_SERVICE_SMOKE: "1"
        run: uv run pytest tests/test_service_windows_integration.py -q

      - name: Construir wheel y sdist
        run: uv build

      - name: Publicar el wheel como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: odin-wheel-windows
          path: dist/*.whl
          if-no-files-found: error
